name: Temporary relight diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    name: Compare relight pixels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install system libraries for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Regenerate and compare representative relight outputs
        run: node tools/forge/diagnose-relight-determinism.cjs
