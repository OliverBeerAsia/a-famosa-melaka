name: CI

# Build, validate art assets, and run tests on every push to main and PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build · Validate · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-canvas (used by the art validators/generators) needs native libs.
      - name: Install system libraries for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Validate art assets and style
        run: npm run validate:all

      - name: Build (tsc + vite, with asset validation gate)
        run: npm run build

      - name: Test
        run: npm test
